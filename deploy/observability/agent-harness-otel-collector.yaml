receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
processors:
  memory_limiter: { limit_mib: 512, spike_limit_mib: 128, check_interval: 1s }
  batch: { timeout: 5s, send_batch_size: 512, send_batch_max_size: 1024 }
  attributes/privacy:
    actions:
      - { key: prompt, action: delete }
      - { key: completion, action: delete }
      - { key: reasoning, action: delete }
      - { key: token, action: delete }
      - { key: authorization, action: delete }
connectors:
  spanmetrics/agent:
    namespace: agent
    histogram: { explicit: { buckets: [0.1s, 1s, 10s, 30s, 60s, 300s] } }
    dimensions:
      - { name: agent.event.type }
      - { name: agent.outcome }
      - { name: agent.operation }
exporters:
  otlphttp/production:
    endpoint: ${env:PROXUS_OTLP_BACKEND_ENDPOINT}
    headers: { Authorization: "Bearer ${env:PROXUS_OTLP_BACKEND_TOKEN}" }
    sending_queue: { enabled: true, queue_size: 2048 }
    retry_on_failure: { enabled: true, max_elapsed_time: 300s }
service:
  telemetry: { logs: { level: info } }
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [spanmetrics/agent, otlphttp/production]
    metrics:
      receivers: [spanmetrics/agent]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/production]
