name: Deploy preview platform

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan or deploy the shared preview platform
        required: true
        default: plan
        type: choice
        options:
          - plan
          - deploy

permissions:
  contents: read

concurrency:
  group: preview-lifecycle
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: europe-southwest1
  ALCHEMY_STATE_BUCKET: ${{ vars.ALCHEMY_STATE_BUCKET }}
  ALCHEMY_STATE_KMS_KEY: ${{ vars.ALCHEMY_STATE_KMS_KEY }}
  PREVIEW_PLATFORM_INSTANCE_NAME: ${{ vars.PREVIEW_PLATFORM_INSTANCE_NAME }}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.policy.outputs.sha }}
    steps:
      - name: Authorize the exact trusted main commit
        id: policy
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          test "$SOURCE_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$SOURCE_SHA"
          [[ "$OPERATION" = plan || "$OPERATION" = deploy ]]
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  operate:
    needs: authorize
    environment: preview
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the authorized main commit before authentication
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          path: trusted
          persist-credentials: false
      - name: Verify trusted checkout and non-secret configuration before authentication
        working-directory: trusted
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
          PROVIDER: ${{ vars.GCP_PREVIEW_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER: ${{ vars.GCP_PREVIEW_DEPLOYER_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          for value in "$GCP_PROJECT_ID" "$GCP_REGION" "$ALCHEMY_STATE_BUCKET" "$ALCHEMY_STATE_KMS_KEY" "$PROVIDER" "$DEPLOYER"; do
            test -n "$value"
          done
          [[ "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$GCP_REGION" = europe-southwest1 ]]
          [[ "$ALCHEMY_STATE_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$ ]]
          [[ "$ALCHEMY_STATE_KMS_KEY" =~ ^projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/keyRings/[A-Za-z0-9_-]+/cryptoKeys/[A-Za-z0-9_-]+$ ]]
          if [[ -n "$PREVIEW_PLATFORM_INSTANCE_NAME" ]]; then
            [[ "$PREVIEW_PLATFORM_INSTANCE_NAME" =~ ^[a-z][a-z0-9-]{0,97}$ ]]
          fi
      - name: Authenticate as the preview deployer without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_PREVIEW_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PREVIEW_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Install frozen dependencies
        working-directory: trusted
        run: |
          npm install --global corepack@0.35.0
          corepack enable pnpm
          pnpm install --frozen-lockfile
      - name: Plan the shared preview platform
        working-directory: trusted
        run: pnpm --filter @proxus/infra alchemy:infra -- plan --stage preview-platform
      - name: Deploy the reviewed plan
        if: inputs.operation == 'deploy'
        working-directory: trusted
        run: pnpm --filter @proxus/infra alchemy:infra -- deploy --stage preview-platform
      - name: Read and summarize non-secret platform outputs
        if: inputs.operation == 'deploy'
        working-directory: trusted
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/preview-platform-outputs.json"
          trap 'rm -f "$output"' EXIT
          pnpm --filter @proxus/infra alchemy:infra -- outputs --stage preview-platform > "$output"
          project="$(jq -er '.project | strings' "$output")"
          region="$(jq -er '.region | strings' "$output")"
          instance="$(jq -er '.instanceName | strings' "$output")"
          connection="$(jq -er '.connectionName | strings' "$output")"
          auth_secret="$(jq -er '.authGoogleSigningSecretId | strings' "$output")"
          object_secret="$(jq -er '.objectStorageSigningSecretId | strings' "$output")"
          mailgun_secret="$(jq -er '.mailgunApiKeySecretId | strings' "$output")"
          bootstrap_password_secret="$(jq -er '.databaseBootstrapPasswordSecretId | strings' "$output")"
          analytics_dataset="$(jq -er '.analyticsDatasetId | strings' "$output")"
          analytics_table="$(jq -er '.analyticsTableId | strings' "$output")"
          test "$project" = "$GCP_PROJECT_ID"
          test "$region" = "$GCP_REGION"
          [[ "$instance" =~ ^[a-z][a-z0-9-]{0,97}$ ]]
          test "$connection" = "$project:$region:$instance"
          test "$auth_secret" = preview-auth-google-signing
          test "$object_secret" = preview-object-storage-signing
          test "$mailgun_secret" = preview-mailgun-api-key
          test "$bootstrap_password_secret" = preview-database-bootstrap-password
          test "$analytics_dataset" = preview_product_analytics
          test "$analytics_table" = events
          {
            echo '## Preview platform outputs'
            printf -- '- Project: `%s`\n' "$project"
            printf -- '- Region: `%s`\n' "$region"
            printf -- '- Cloud SQL instance: `%s`\n' "$instance"
            printf -- '- Connection name: `%s`\n' "$connection"
            printf -- '- Auth signing secret ID: `%s`\n' "$auth_secret"
            printf -- '- Object signing secret ID: `%s`\n' "$object_secret"
            printf -- '- Mailgun secret ID: `%s`\n' "$mailgun_secret"
            printf -- '- Database bootstrap password secret ID: `%s`\n' "$bootstrap_password_secret"
            printf -- '- Analytics dataset/table: `%s.%s`\n' "$analytics_dataset" "$analytics_table"
            echo '- IDs are metadata only; no secret versions or values are outputs.'
          } >> "$GITHUB_STEP_SUMMARY"
