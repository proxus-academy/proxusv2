name: Reconcile previews

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-lifecycle
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: europe-southwest1
  ALCHEMY_STATE_BUCKET: ${{ vars.ALCHEMY_STATE_BUCKET }}
  ALCHEMY_STATE_KMS_KEY: ${{ vars.ALCHEMY_STATE_KMS_KEY }}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      iac_sha: ${{ steps.policy.outputs.iac_sha }}
    steps:
      - name: Authorize only trusted main reconciliation code
        id: policy
        env:
          SOURCE_REF: ${{ github.ref }}
          IAC_SHA: ${{ github.workflow_sha }}
        run: |
          test "$SOURCE_REF" = refs/heads/main
          [[ "$IAC_SHA" =~ ^[a-f0-9]{40}$ ]]
          printf 'iac_sha=%s\n' "$IAC_SHA" >> "$GITHUB_OUTPUT"

  reconcile:
    needs: authorize
    environment: preview
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Authenticate as the preview deployer without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_PREVIEW_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PREVIEW_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Check out trusted main IaC after authentication
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.iac_sha }}
          path: trusted
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Install frozen dependencies
        working-directory: trusted
        run: |
          npm install --global corepack@0.35.0
          corepack enable pnpm
          pnpm install --frozen-lockfile
      - name: Destroy Alchemy stages without a current eligible pull request
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          IAC_SHA: ${{ needs.authorize.outputs.iac_sha }}
          DEPLOY_SERVICES: "false"
          GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
          GCP_PREVIEW_DEPLOYER_PRINCIPAL: serviceAccount:${{ vars.GCP_PREVIEW_DEPLOYER_SERVICE_ACCOUNT }}
          AUTH_GOOGLE_SIGNING_SECRET_ID: ${{ vars.AUTH_SIGNING_SECRET_ID }}
          OBJECT_STORAGE_SIGNING_SECRET_ID: ${{ vars.OBJECT_STORAGE_SIGNING_SECRET_ID }}
          MAILGUN_API_KEY_SECRET_ID: ${{ vars.MAILGUN_API_KEY_SECRET_ID }}
          DATABASE_BOOTSTRAP_PASSWORD_SECRET_ID: ${{ vars.DATABASE_BOOTSTRAP_PASSWORD_SECRET_ID }}
          MAILGUN_DOMAIN: ${{ vars.MAILGUN_DOMAIN }}
          MAILGUN_FROM: ${{ vars.MAILGUN_FROM }}
          ANALYTICS_PROJECT_ID: ${{ vars.PRODUCT_ANALYTICS_PROJECT_ID }}
          ANALYTICS_DATASET: ${{ vars.PRODUCT_ANALYTICS_DATASET }}
          ANALYTICS_TABLE: ${{ vars.PRODUCT_ANALYTICS_TABLE }}
          IAP_ACCESS_PRINCIPAL: ${{ vars.IAP_ACCESS_PRINCIPAL }}
          CLOUD_SQL_PROJECT_ID: ${{ vars.CLOUD_SQL_PROJECT_ID }}
          CLOUD_SQL_INSTANCE_NAME: ${{ vars.CLOUD_SQL_INSTANCE_NAME }}
          CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IAC_SHA"
          for value in "$GCP_PROJECT_ID" "$MAILGUN_DOMAIN" "$MAILGUN_FROM" "$CLOUD_SQL_PROJECT_ID" "$CLOUD_SQL_INSTANCE_NAME" "$CLOUD_SQL_CONNECTION_NAME"; do
            test -n "$value"
          done
          [[ "$CLOUD_SQL_CONNECTION_NAME" == "$CLOUD_SQL_PROJECT_ID:$GCP_REGION:$CLOUD_SQL_INSTANCE_NAME" ]]

          stages_file="$(mktemp)"
          prs_file="$(mktemp)"
          trap 'rm -f "$stages_file" "$prs_file"' EXIT
          pnpm --filter @proxus/infra alchemy:infra -- list-preview-stages > "$stages_file"
          gh api --method GET --paginate "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f base=main -f per_page=100 \
            | jq -s --arg repository "$GITHUB_REPOSITORY" '[.[][] | select(
                .state == "open" and .base.ref == "main" and
                .base.repo.full_name == $repository and .head.repo.full_name == $repository and
                any(.labels[]?; .name == "deploy-preview")
              ) | .number] | unique' > "$prs_file"

          mapfile -t orphan_stages < <(jq -r --slurpfile prs "$prs_file" '.[] | select((.[3:] | tonumber) as $pr | ($prs[0] | index($pr) | not))' "$stages_file")
          for stage in "${orphan_stages[@]}"; do
            [[ "$stage" =~ ^pr-([1-9][0-9]{0,5})$ ]]
            pr="${BASH_REMATCH[1]}"
            export PR_NUMBER="$pr"
            digest="$(printf '0%.0s' {1..64})"
            export IMAGE_PUBLIC_API="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/proxus/proxus-server@sha256:$digest"
            export IMAGE_ADMIN_API="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/proxus/proxus-admin-server@sha256:$digest"
            export IMAGE_WEB="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/proxus/proxus-web@sha256:$digest"
            export IMAGE_ADMIN_WEB="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/proxus/proxus-admin-web@sha256:$digest"
            # The wrapper acquires and renews the fenced GCS/KMS lease for this exact stage.
            pnpm --filter @proxus/infra alchemy:infra -- destroy --pr "$pr"
          done
