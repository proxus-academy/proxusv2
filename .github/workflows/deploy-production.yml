name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: europe-southwest1
  ALCHEMY_STATE_BUCKET: ${{ vars.ALCHEMY_STATE_BUCKET }}
  ALCHEMY_STATE_KMS_KEY: ${{ vars.ALCHEMY_STATE_KMS_KEY }}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.policy.outputs.sha }}
    steps:
      - name: Authorize only the exact main commit carrying this workflow
        id: policy
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "$SOURCE_REF" = refs/heads/main
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$WORKFLOW_SHA" = "$SOURCE_SHA"
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: authorize
    environment: production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      public_image: ${{ steps.images.outputs.public_image }}
      admin_image: ${{ steps.images.outputs.admin_image }}
      web_image: ${{ steps.images.outputs.web_image }}
      admin_web_image: ${{ steps.images.outputs.admin_web_image }}
    steps:
      - name: Authenticate as the build submitter without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SUBMITTER_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Check out the authorized main commit after authentication
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          path: trusted
          persist-credentials: false
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Verify trusted checkout and build configuration
        working-directory: trusted
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
          PROVIDER: ${{ vars.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          BUILDER: ${{ vars.GCP_BUILD_SUBMITTER_SERVICE_ACCOUNT }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          for value in "$GCP_PROJECT_ID" "$PROVIDER" "$BUILDER"; do
            test -n "$value"
          done
      - name: Build and publish four immutable images in Cloud Build
        id: images
        working-directory: trusted
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
          SOURCE_REVISION: ${{ needs.authorize.outputs.sha }}
          SOURCE_URL: https://github.com/${{ github.repository }}.git
          IMAGE_TAG_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
        run: infra/scripts/build-images.sh

  deploy:
    needs: [authorize, build]
    environment: production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_PRODUCTION_DEPLOYER_PRINCIPAL: serviceAccount:${{ vars.GCP_PRODUCTION_DEPLOYER_SERVICE_ACCOUNT }}
      IMAGE_PUBLIC_API: ${{ needs.build.outputs.public_image }}
      IMAGE_ADMIN_API: ${{ needs.build.outputs.admin_image }}
      IMAGE_WEB: ${{ needs.build.outputs.web_image }}
      IMAGE_ADMIN_WEB: ${{ needs.build.outputs.admin_web_image }}
      DATABASE_SECRET_ID: ${{ vars.POSTGRES_PRODUCTION_DATABASE_SECRET_ID }}
      AUTH_GOOGLE_SIGNING_SECRET_ID: ${{ vars.AUTH_SIGNING_SECRET_ID }}
      OBJECT_STORAGE_SIGNING_SECRET_ID: ${{ vars.OBJECT_STORAGE_SIGNING_SECRET_ID }}
      MAILGUN_API_KEY_SECRET_ID: ${{ vars.MAILGUN_API_KEY_SECRET_ID }}
      MAILGUN_DOMAIN: ${{ vars.MAILGUN_DOMAIN }}
      MAILGUN_FROM: ${{ vars.MAILGUN_FROM }}
      ANALYTICS_PROJECT_ID: ${{ vars.PRODUCT_ANALYTICS_PROJECT_ID }}
      ANALYTICS_DATASET: ${{ vars.PRODUCT_ANALYTICS_DATASET }}
      ANALYTICS_TABLE: ${{ vars.PRODUCT_ANALYTICS_TABLE }}
      PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
      PRODUCTION_WEB_BUCKET: ${{ vars.PRODUCTION_WEBSITE_BUCKET }}
      IAP_ACCESS_PRINCIPAL: ${{ vars.IAP_ACCESS_PRINCIPAL }}
      APPLICATION_RUNTIME_READY: ${{ vars.APPLICATION_RUNTIME_READY }}
    steps:
      - name: Authenticate as the production deployer without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PRODUCTION_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Check out the authorized main commit after authentication
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          path: trusted
          persist-credentials: false
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Verify trusted checkout, runtime gates and immutable inputs
        working-directory: trusted
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
          PROVIDER: ${{ vars.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER: ${{ vars.GCP_PRODUCTION_DEPLOYER_SERVICE_ACCOUNT }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          for value in "$GCP_PROJECT_ID" "$GCP_PROJECT_NUMBER" "$PROVIDER" "$DEPLOYER" "$ALCHEMY_STATE_BUCKET" "$ALCHEMY_STATE_KMS_KEY" "$DATABASE_SECRET_ID" "$AUTH_GOOGLE_SIGNING_SECRET_ID" "$OBJECT_STORAGE_SIGNING_SECRET_ID" "$MAILGUN_API_KEY_SECRET_ID" "$MAILGUN_DOMAIN" "$MAILGUN_FROM" "$ANALYTICS_PROJECT_ID" "$ANALYTICS_DATASET" "$ANALYTICS_TABLE" "$PRODUCTION_DOMAIN" "$PRODUCTION_WEB_BUCKET" "$IAP_ACCESS_PRINCIPAL"; do
            test -n "$value"
          done
          test "$APPLICATION_RUNTIME_READY" = true
          [[ "$GCP_PROJECT_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$IAP_ACCESS_PRINCIPAL" =~ ^(user|group):[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]
          for image in "$IMAGE_PUBLIC_API" "$IMAGE_ADMIN_API" "$IMAGE_WEB" "$IMAGE_ADMIN_WEB"; do
            [[ "$image" =~ ^${GCP_REGION}-docker\.pkg\.dev/${GCP_PROJECT_ID}/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          done
      - name: Install frozen dependencies
        working-directory: trusted
        run: |
          npm install --global corepack@0.35.0
          corepack enable pnpm
          pnpm install --frozen-lockfile
      - name: Prepare a non-deployable manifest for the migration-only phase
        working-directory: trusted
        run: |
          manifest="$RUNNER_TEMP/production-static-manifest.json"
          printf '{"files":[]}\n' > "$manifest"
          printf 'STATIC_MANIFEST_JSON_PATH=%s\n' "$manifest" >> "$GITHUB_ENV"
          printf 'STATIC_MANIFEST_SHA256=%s\n' "$(sha256sum "$manifest" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Plan migration infrastructure only
        working-directory: trusted
        env:
          DEPLOY_SERVICES: "false"
        run: pnpm --filter @proxus/infra alchemy:infra -- plan --stage production
      - name: Deploy migration infrastructure only
        working-directory: trusted
        env:
          DEPLOY_SERVICES: "false"
        run: pnpm --filter @proxus/infra alchemy:infra -- deploy --stage production
      - name: Read the ordered migration job output
        id: migration
        working-directory: trusted
        env:
          DEPLOY_SERVICES: "false"
        run: |
          output="$RUNNER_TEMP/production-migration-outputs.json"
          pnpm --filter @proxus/infra alchemy:infra -- outputs --stage production > "$output"
          printf 'job=%s\n' "$(jq -er '.migrationJob.name' "$output")" >> "$GITHUB_OUTPUT"
          rm -f "$output"
      - name: Run the ordered database migration job
        run: gcloud run jobs execute "${{ steps.migration.outputs.job }}" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait
      - name: Extract the web artifact from its immutable image
        working-directory: trusted
        env:
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/production-web
        run: infra/scripts/extract-web-artifact.sh
      - name: Generate and authenticate the static artifact manifest
        working-directory: trusted
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/production-web
        run: |
          manifest="$RUNNER_TEMP/production-static-manifest.json"
          python3 - "$ARTIFACT_DIRECTORY" "$manifest" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1]).resolve()
          files = []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              relative = path.relative_to(root).as_posix()
              data = path.read_bytes()
              files.append({"name": relative, "path": str(path), "sha256": hashlib.sha256(data).hexdigest(), "size": len(data)})
          if not any(entry["name"] == "index.html" for entry in files):
              raise SystemExit("static artifact has no index.html")
          pathlib.Path(sys.argv[2]).write_text(json.dumps({"files": files}, separators=(",", ":")) + "\n")
          PY
          printf 'STATIC_MANIFEST_JSON_PATH=%s\n' "$manifest" >> "$GITHUB_ENV"
          printf 'STATIC_MANIFEST_SHA256=%s\n' "$(sha256sum "$manifest" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Plan application services and private static CDN
        working-directory: trusted
        env:
          DEPLOY_SERVICES: "true"
        run: pnpm --filter @proxus/infra alchemy:infra -- plan --stage production
      - name: Deploy application services and private static CDN
        working-directory: trusted
        env:
          DEPLOY_SERVICES: "true"
        run: pnpm --filter @proxus/infra alchemy:infra -- deploy --stage production
      - name: Read deployment outputs and record the manual DNS action
        working-directory: trusted
        env:
          DEPLOY_SERVICES: "true"
        run: |
          output="$RUNNER_TEMP/production-outputs.json"
          pnpm --filter @proxus/infra alchemy:infra -- outputs --stage production > "$output"
          dns="$(jq -er '.requiredDnsARecord' "$output")"
          public_url="$(jq -er '.publicApiUrl' "$output")"
          admin_url="$(jq -er '.adminUrl' "$output")"
          website_url="$(jq -er '.websiteUrl' "$output")"
          {
            echo '## Production deployment outputs'
            printf -- '- Required manual DNS A record: `%s`\n' "$dns"
            printf -- '- Public API: `%s`\n- Admin: `%s`\n- Website: `%s`\n' "$public_url" "$admin_url" "$website_url"
            echo '- DNS was not modified by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$output"
      - name: Record safe smoke-test placeholders
        run: |
          {
            echo '## Post-deploy gates still requiring an operator'
            echo '- Wait for the managed certificate before testing the public hostname.'
            echo '- Run authenticated IAP, public/admin API, private CDN, and direct-access-denial smoke tests.'
            echo '- No placeholder performs network requests or claims that a smoke test passed.'
          } >> "$GITHUB_STEP_SUMMARY"
