name: Deploy preview

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-lifecycle
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: europe-southwest1
  ALCHEMY_STATE_BUCKET: ${{ vars.ALCHEMY_STATE_BUCKET }}
  ALCHEMY_STATE_KMS_KEY: ${{ vars.ALCHEMY_STATE_KMS_KEY }}

jobs:
  authorize:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      sha: ${{ steps.policy.outputs.sha }}
      iac_sha: ${{ steps.policy.outputs.iac_sha }}
      pr: ${{ steps.policy.outputs.pr }}
    steps:
      - name: Resolve current label state and authorize the exact reviewed commit
        id: policy
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          IAC_SHA: ${{ github.workflow_sha }}
        with:
          script: |
            const eventPr = context.payload.pull_request
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: eventPr.number,
            })
            core.setOutput("pr", String(pr.number))
            if (!/^[a-f0-9]{40}$/.test(process.env.IAC_SHA ?? "")) {
              core.setFailed("The trusted main workflow SHA is not immutable.")
              return
            }
            core.setOutput("iac_sha", process.env.IAC_SHA)
            const labeled = pr.labels.some(({ name }) => name === "deploy-preview")
            if (pr.state !== "open") {
              core.setOutput("mode", "destroy")
              return
            }
            if (!labeled) {
              const removedPreviewLabel = context.payload.action === "unlabeled" &&
                context.payload.label?.name === "deploy-preview"
              core.setOutput("mode", removedPreviewLabel ? "destroy" : "none")
              return
            }
            const repository = `${context.repo.owner}/${context.repo.repo}`
            if (pr.base.ref !== "main" || pr.base.repo.full_name !== repository) {
              core.setFailed("Preview IaC is authorized only from the main base branch.")
              return
            }
            if (pr.head.repo?.full_name !== repository) {
              core.setFailed("Previews never build code from forks.")
              return
            }
            if (!/^[a-f0-9]{40}$/.test(pr.head.sha)) {
              core.setFailed("The PR head is not an immutable commit SHA.")
              return
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            })
            const latestByReviewer = new Map()
            for (const review of reviews) {
              if (review.user?.login && !new Set(["COMMENTED", "PENDING"]).has(review.state)) {
                latestByReviewer.set(review.user.login, review)
              }
            }
            const trusted = new Set(["OWNER", "MEMBER", "COLLABORATOR"])
            const approved = [...latestByReviewer.values()].some((review) =>
              review.state === "APPROVED" &&
              review.commit_id === pr.head.sha &&
              trusted.has(review.author_association)
            )
            if (!approved) {
              core.setFailed("The current preview commit requires a current approval from an owner, member, or collaborator.")
              return
            }
            core.setOutput("sha", pr.head.sha)
            core.setOutput("mode", "deploy")

  build:
    needs: authorize
    if: needs.authorize.outputs.mode == 'deploy'
    environment: preview
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      public_image: ${{ steps.images.outputs.public_image }}
      admin_image: ${{ steps.images.outputs.admin_image }}
      web_image: ${{ steps.images.outputs.web_image }}
      admin_web_image: ${{ steps.images.outputs.admin_web_image }}
    steps:
      - name: Revalidate the reviewed PR after environment approval
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_PR: ${{ needs.authorize.outputs.pr }}
          EXPECTED_SHA: ${{ needs.authorize.outputs.sha }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.EXPECTED_PR),
            })
            const repository = `${context.repo.owner}/${context.repo.repo}`
            if (
              pr.state !== "open" ||
              !pr.labels.some(({ name }) => name === "deploy-preview") ||
              pr.base.ref !== "main" ||
              pr.base.repo.full_name !== repository ||
              pr.head.repo?.full_name !== repository ||
              pr.head.sha !== process.env.EXPECTED_SHA
            ) {
              core.setFailed("The pull request changed before the build obtained credentials.")
              return
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            })
            const latestByReviewer = new Map()
            for (const review of reviews) {
              if (review.user?.login && !new Set(["COMMENTED", "PENDING"]).has(review.state)) {
                latestByReviewer.set(review.user.login, review)
              }
            }
            const trusted = new Set(["OWNER", "MEMBER", "COLLABORATOR"])
            const approved = [...latestByReviewer.values()].some((review) =>
              review.state === "APPROVED" &&
              review.commit_id === pr.head.sha &&
              trusted.has(review.author_association)
            )
            if (!approved) core.setFailed("The exact build commit no longer has a current trusted approval.")
      - name: Authenticate as the build submitter without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_PREVIEW_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SUBMITTER_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Check out only trusted main IaC after authentication
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.iac_sha }}
          path: trusted
          persist-credentials: false
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Verify trusted IaC and configurable preview gates
        working-directory: trusted
        env:
          IAC_SHA: ${{ needs.authorize.outputs.iac_sha }}
          PROVIDER: ${{ vars.GCP_PREVIEW_WORKLOAD_IDENTITY_PROVIDER }}
          BUILDER: ${{ vars.GCP_BUILD_SUBMITTER_SERVICE_ACCOUNT }}
          IAP_PRINCIPAL: ${{ vars.IAP_ACCESS_PRINCIPAL }}
          AUTH_SECRET: ${{ vars.AUTH_SIGNING_SECRET_ID }}
          OBJECT_SECRET: ${{ vars.OBJECT_STORAGE_SIGNING_SECRET_ID }}
          MAILGUN_SECRET: ${{ vars.MAILGUN_API_KEY_SECRET_ID }}
          BOOTSTRAP_PASSWORD_SECRET: ${{ vars.DATABASE_BOOTSTRAP_PASSWORD_SECRET_ID }}
          MAILGUN_DOMAIN: ${{ vars.MAILGUN_DOMAIN }}
          MAILGUN_FROM: ${{ vars.MAILGUN_FROM }}
          ANALYTICS_DATASET: ${{ vars.PRODUCT_ANALYTICS_DATASET }}
          ANALYTICS_TABLE: ${{ vars.PRODUCT_ANALYTICS_TABLE }}
          CLOUD_SQL_PROJECT_ID: ${{ vars.CLOUD_SQL_PROJECT_ID }}
          CLOUD_SQL_INSTANCE_NAME: ${{ vars.CLOUD_SQL_INSTANCE_NAME }}
          CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
          RUNTIME_READY: ${{ vars.APPLICATION_RUNTIME_READY }}
        run: |
          test "$(git rev-parse HEAD)" = "$IAC_SHA"
          for value in "$GCP_PROJECT_ID" "$PROVIDER" "$BUILDER" "$IAP_PRINCIPAL" "$AUTH_SECRET" "$OBJECT_SECRET" "$MAILGUN_SECRET" "$BOOTSTRAP_PASSWORD_SECRET" "$MAILGUN_DOMAIN" "$MAILGUN_FROM" "$ANALYTICS_DATASET" "$ANALYTICS_TABLE" "$CLOUD_SQL_PROJECT_ID" "$CLOUD_SQL_INSTANCE_NAME" "$CLOUD_SQL_CONNECTION_NAME"; do
            test -n "$value"
          done
          [[ "$CLOUD_SQL_CONNECTION_NAME" == "$CLOUD_SQL_PROJECT_ID:$GCP_REGION:$CLOUD_SQL_INSTANCE_NAME" ]]
          [[ "$IAP_PRINCIPAL" =~ ^(user|group):[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]
          test "$RUNTIME_READY" = true
      - name: Build the exact reviewed commit in least-privilege Cloud Build
        id: images
        working-directory: trusted
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.sha }}
          SOURCE_REVISION: ${{ needs.authorize.outputs.sha }}
          SOURCE_URL: https://github.com/${{ github.repository }}.git
          IMAGE_TAG_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
        run: infra/scripts/build-images.sh

  deploy:
    needs: [authorize, build]
    if: needs.authorize.outputs.mode == 'deploy'
    environment: preview
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_PREVIEW_DEPLOYER_PRINCIPAL: serviceAccount:${{ vars.GCP_PREVIEW_DEPLOYER_SERVICE_ACCOUNT }}
      IMAGE_PUBLIC_API: ${{ needs.build.outputs.public_image }}
      IMAGE_ADMIN_API: ${{ needs.build.outputs.admin_image }}
      IMAGE_WEB: ${{ needs.build.outputs.web_image }}
      IMAGE_ADMIN_WEB: ${{ needs.build.outputs.admin_web_image }}
      AUTH_GOOGLE_SIGNING_SECRET_ID: ${{ vars.AUTH_SIGNING_SECRET_ID }}
      OBJECT_STORAGE_SIGNING_SECRET_ID: ${{ vars.OBJECT_STORAGE_SIGNING_SECRET_ID }}
      MAILGUN_API_KEY_SECRET_ID: ${{ vars.MAILGUN_API_KEY_SECRET_ID }}
      DATABASE_BOOTSTRAP_PASSWORD_SECRET_ID: ${{ vars.DATABASE_BOOTSTRAP_PASSWORD_SECRET_ID }}
      MAILGUN_DOMAIN: ${{ vars.MAILGUN_DOMAIN }}
      MAILGUN_FROM: ${{ vars.MAILGUN_FROM }}
      ANALYTICS_PROJECT_ID: ${{ vars.PRODUCT_ANALYTICS_PROJECT_ID }}
      ANALYTICS_DATASET: ${{ vars.PRODUCT_ANALYTICS_DATASET }}
      ANALYTICS_TABLE: ${{ vars.PRODUCT_ANALYTICS_TABLE }}
      IAP_ACCESS_PRINCIPAL: ${{ vars.IAP_ACCESS_PRINCIPAL }}
      CLOUD_SQL_PROJECT_ID: ${{ vars.CLOUD_SQL_PROJECT_ID }}
      CLOUD_SQL_INSTANCE_NAME: ${{ vars.CLOUD_SQL_INSTANCE_NAME }}
      CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
    steps:
      - name: Refuse stale images after environment approval
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_PR: ${{ needs.authorize.outputs.pr }}
          EXPECTED_SHA: ${{ needs.authorize.outputs.sha }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.EXPECTED_PR),
            })
            const repository = `${context.repo.owner}/${context.repo.repo}`
            if (
              pr.state !== "open" ||
              !pr.labels.some(({ name }) => name === "deploy-preview") ||
              pr.base.ref !== "main" ||
              pr.base.repo.full_name !== repository ||
              pr.head.repo?.full_name !== repository ||
              pr.head.sha !== process.env.EXPECTED_SHA
            ) {
              core.setFailed("The pull request changed while its images were building; refusing a stale deployment.")
              return
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            })
            const latestByReviewer = new Map()
            for (const review of reviews) {
              if (review.user?.login && !new Set(["COMMENTED", "PENDING"]).has(review.state)) {
                latestByReviewer.set(review.user.login, review)
              }
            }
            const trusted = new Set(["OWNER", "MEMBER", "COLLABORATOR"])
            const approved = [...latestByReviewer.values()].some((review) =>
              review.state === "APPROVED" &&
              review.commit_id === pr.head.sha &&
              trusted.has(review.author_association)
            )
            if (!approved) core.setFailed("The exact built commit no longer has a current trusted approval.")
      - name: Authenticate as the preview deployer without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_PREVIEW_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PREVIEW_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Check out only trusted main IaC after authentication
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.iac_sha }}
          path: trusted
          persist-credentials: false
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Verify trusted checkout and immutable image outputs
        working-directory: trusted
        env:
          IAC_SHA: ${{ needs.authorize.outputs.iac_sha }}
          PUBLIC_IMAGE: ${{ needs.build.outputs.public_image }}
          ADMIN_IMAGE: ${{ needs.build.outputs.admin_image }}
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
          ADMIN_WEB_IMAGE: ${{ needs.build.outputs.admin_web_image }}
        run: |
          test "$(git rev-parse HEAD)" = "$IAC_SHA"
          for value in "$PUBLIC_IMAGE" "$ADMIN_IMAGE" "$WEB_IMAGE" "$ADMIN_WEB_IMAGE"; do
            [[ "$value" =~ @sha256:[a-f0-9]{64}$ ]]
          done
      - name: Install frozen dependencies
        working-directory: trusted
        run: |
          npm install --global corepack@0.35.0
          corepack enable pnpm
          pnpm install --frozen-lockfile
      - name: Plan migration and database bootstrap infrastructure
        working-directory: trusted
        env:
          DEPLOY_SERVICES: "false"
        run: pnpm --filter @proxus/infra alchemy:infra -- plan --pr "${{ needs.authorize.outputs.pr }}"
      - name: Deploy migration and database bootstrap infrastructure
        working-directory: trusted
        env:
          DEPLOY_SERVICES: "false"
        run: pnpm --filter @proxus/infra alchemy:infra -- deploy --pr "${{ needs.authorize.outputs.pr }}"
      - name: Read ordered job outputs
        id: jobs
        working-directory: trusted
        env:
          DEPLOY_SERVICES: "false"
        run: |
          pnpm --filter @proxus/infra alchemy:infra -- outputs --pr "${{ needs.authorize.outputs.pr }}" > "$RUNNER_TEMP/preview-outputs.json"
          printf 'bootstrap=%s\n' "$(jq -er '.databaseBootstrapJob.name' "$RUNNER_TEMP/preview-outputs.json")" >> "$GITHUB_OUTPUT"
          printf 'migration=%s\n' "$(jq -er '.migrationJob.name' "$RUNNER_TEMP/preview-outputs.json")" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/preview-outputs.json"
      - name: Run the preview database bootstrap job
        run: gcloud run jobs execute "${{ steps.jobs.outputs.bootstrap }}" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait
      - name: Run the ordered preview migration job
        run: gcloud run jobs execute "${{ steps.jobs.outputs.migration }}" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait
      - name: Plan the IAP-protected preview services
        working-directory: trusted
        env:
          DEPLOY_SERVICES: "true"
        run: pnpm --filter @proxus/infra alchemy:infra -- plan --pr "${{ needs.authorize.outputs.pr }}"
      - name: Deploy the IAP-protected preview services
        working-directory: trusted
        env:
          DEPLOY_SERVICES: "true"
        run: pnpm --filter @proxus/infra alchemy:infra -- deploy --pr "${{ needs.authorize.outputs.pr }}"
      - name: Read preview URLs
        id: urls
        working-directory: trusted
        env:
          DEPLOY_SERVICES: "true"
        run: |
          pnpm --filter @proxus/infra alchemy:infra -- outputs --pr "${{ needs.authorize.outputs.pr }}" > "$RUNNER_TEMP/preview-outputs.json"
          printf 'public=%s\n' "$(jq -er '.publicUrl' "$RUNNER_TEMP/preview-outputs.json")" >> "$GITHUB_OUTPUT"
          printf 'admin=%s\n' "$(jq -er '.adminUrl' "$RUNNER_TEMP/preview-outputs.json")" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/preview-outputs.json"
      - name: Comment on the pull request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PUBLIC_URL: ${{ steps.urls.outputs.public }}
          ADMIN_URL: ${{ steps.urls.outputs.admin }}
        with:
          script: |
            const marker = "<!-- proxus-preview -->"
            const body = `${marker}\nIAP preview for this reviewed commit:\n\n- Public: ${process.env.PUBLIC_URL}\n- Admin: ${process.env.ADMIN_URL}`
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const previous = comments.find((comment) => comment.body?.includes(marker) && comment.user?.type === "Bot")
            if (previous) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body })
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body })
            }

  destroy:
    needs: authorize
    if: needs.authorize.outputs.mode == 'destroy'
    environment: preview
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Refuse destruction when the preview became active again
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_PR: ${{ needs.authorize.outputs.pr }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.EXPECTED_PR),
            })
            if (pr.state === "open" && pr.labels.some(({ name }) => name === "deploy-preview")) {
              core.setFailed("The pull request is open and labeled again; refusing stale destruction.")
            }
      - name: Authenticate as the preview deployer without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_PREVIEW_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PREVIEW_DEPLOYER_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Check out only trusted main IaC after authentication
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.iac_sha }}
          path: trusted
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Install frozen dependencies
        working-directory: trusted
        run: |
          npm install --global corepack@0.35.0
          corepack enable pnpm
          pnpm install --frozen-lockfile
      - name: Destroy only the exact PR Alchemy stage
        working-directory: trusted
        env:
          IAC_SHA: ${{ needs.authorize.outputs.iac_sha }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr }}
          DEPLOY_SERVICES: "false"
          GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
          GCP_PREVIEW_DEPLOYER_PRINCIPAL: serviceAccount:${{ vars.GCP_PREVIEW_DEPLOYER_SERVICE_ACCOUNT }}
          AUTH_GOOGLE_SIGNING_SECRET_ID: ${{ vars.AUTH_SIGNING_SECRET_ID }}
          OBJECT_STORAGE_SIGNING_SECRET_ID: ${{ vars.OBJECT_STORAGE_SIGNING_SECRET_ID }}
          MAILGUN_API_KEY_SECRET_ID: ${{ vars.MAILGUN_API_KEY_SECRET_ID }}
          DATABASE_BOOTSTRAP_PASSWORD_SECRET_ID: ${{ vars.DATABASE_BOOTSTRAP_PASSWORD_SECRET_ID }}
          MAILGUN_DOMAIN: ${{ vars.MAILGUN_DOMAIN }}
          MAILGUN_FROM: ${{ vars.MAILGUN_FROM }}
          ANALYTICS_PROJECT_ID: ${{ vars.PRODUCT_ANALYTICS_PROJECT_ID }}
          ANALYTICS_DATASET: ${{ vars.PRODUCT_ANALYTICS_DATASET }}
          ANALYTICS_TABLE: ${{ vars.PRODUCT_ANALYTICS_TABLE }}
          IAP_ACCESS_PRINCIPAL: ${{ vars.IAP_ACCESS_PRINCIPAL }}
          CLOUD_SQL_PROJECT_ID: ${{ vars.CLOUD_SQL_PROJECT_ID }}
          CLOUD_SQL_INSTANCE_NAME: ${{ vars.CLOUD_SQL_INSTANCE_NAME }}
          CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
        run: |
          test "$(git rev-parse HEAD)" = "$IAC_SHA"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,5}$ ]]
          digest="$(printf '0%.0s' {1..64})"
          export IMAGE_PUBLIC_API="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/proxus/proxus-server@sha256:$digest"
          export IMAGE_ADMIN_API="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/proxus/proxus-admin-server@sha256:$digest"
          export IMAGE_WEB="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/proxus/proxus-web@sha256:$digest"
          export IMAGE_ADMIN_WEB="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/proxus/proxus-admin-web@sha256:$digest"
          pnpm --filter @proxus/infra alchemy:infra -- destroy --pr "$PR_NUMBER"
